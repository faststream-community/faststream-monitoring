name: ci

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Load cached Pre-Commit Dependencies
        id: cached-pre-commit-dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit/
          key: pre-commit-4|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: 3.12
          allow-python-prereleases: false
          cache: true
          cache-dependency-path: |
            ./pdm.lock

      - name: Install dependencies
        run: pdm install -G:all

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Execute Pre-Commit
        run: pdm run pre-commit run --show-diff-on-failure --color=always --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: 3.12
          allow-python-prereleases: false
          cache: true
          cache-dependency-path: |
            ./pdm.lock

      - name: Install dependencies
        run: pdm install -G:all

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Run tests
        run: pdm run pytest tests --cov=exchange

      - name: Publish coverage summary
        run: pdm run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Check Prometheus receives application metrics
        timeout-minutes: 10
        env:
          COMPOSE_PROFILES: exchange,grafana
        run: |
          trap 'docker compose down -v' EXIT
          docker compose up -d --build order trade notification prometheus
          query='count(count by (job) ({__name__=~"faststream_.+",job=~"order|trade|notification"}))'
          for attempt in {1..30}; do
            if curl -fsSG --max-time 4 --data-urlencode "query=$query" http://localhost:9090/api/v1/query |
              jq -e '.status == "success" and .data.result[0].value[1] == "3"' > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps -a
          exit 1
